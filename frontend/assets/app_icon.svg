<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08142c"/>
      <stop offset="100%" stop-color="#0f2b5c"/>
    </linearGradient>
    <linearGradient id="goldRoof" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="tealBldg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d7a72"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="8" y="8" width="496" height="496" rx="112" ry="112" fill="url(#bgGrad)" stroke="#14b8a6" stroke-width="10"/>

  <!-- Subtle Inner Border -->
  <rect x="24" y="24" width="464" height="464" rx="96" ry="96" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="3"/>

  <!-- Left & Right Wing Buildings -->
  <rect x="85" y="220" width="70" height="135" rx="6" fill="#0b5550"/>
  <rect x="357" y="220" width="70" height="135" rx="6" fill="#0b5550"/>

  <!-- Central Tower -->
  <rect x="150" y="145" width="212" height="210" rx="8" fill="url(#tealBldg)" filter="url(#glow)"/>

  <!-- Gold Triangular Roof Gable -->
  <polygon points="144,148 256,76 368,148" fill="url(#goldRoof)"/>

  <!-- Mini Gold Flagpole -->
  <line x1="256" y1="76" x2="256" y2="48" stroke="#fcd34d" stroke-width="4" stroke-linecap="round"/>
  <polygon points="256,48 284,58 256,68" fill="#f59e0b"/>

  <!-- Glowing Hostel Windows (Central Tower) -->
  <g fill="#fef08a">
    <rect x="180" y="170" width="26" height="30" rx="4"/>
    <rect x="243" y="170" width="26" height="30" rx="4"/>
    <rect x="306" y="170" width="26" height="30" rx="4"/>

    <rect x="180" y="220" width="26" height="30" rx="4"/>
    <rect x="243" y="220" width="26" height="30" rx="4"/>
    <rect x="306" y="220" width="26" height="30" rx="4"/>

    <rect x="180" y="270" width="26" height="30" rx="4"/>
    <rect x="243" y="270" width="26" height="30" rx="4"/>
    <rect x="306" y="270" width="26" height="30" rx="4"/>
  </g>

  <!-- Wing Windows -->
  <g fill="rgba(254, 240, 138, 0.8)">
    <rect x="106" y="240" width="24" height="28" rx="3"/>
    <rect x="106" y="285" width="24" height="28" rx="3"/>
    <rect x="382" y="240" width="24" height="28" rx="3"/>
    <rect x="382" y="285" width="24" height="28" rx="3"/>
  </g>

  <!-- Grand Central Entrance Arch -->
  <path d="M 234 355 L 234 318 C 234 306 278 306 278 318 L 278 355 Z" fill="#08142c"/>

  <!-- SPIT Title Text -->
  <text x="256" y="420" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="4">SPIT</text>

  <!-- HOSTEL OPS Subtitle -->
  <text x="256" y="458" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#2dd4bf" letter-spacing="6">HOSTEL OPS</text>
</svg>
